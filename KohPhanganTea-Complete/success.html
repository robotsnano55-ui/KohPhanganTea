<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful - Koh Phangan Chinese Tea</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .success-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .success-content {
            max-width: 600px;
        }
        .success-icon {
            font-size: 5rem;
            margin-bottom: 30px;
        }
        .success-title {
            font-size: 2.5rem;
            color: #2d5016;
            margin-bottom: 20px;
        }
        .success-message {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.8;
        }
        .back-btn {
            display: inline-block;
            padding: 15px 40px;
            background: #2d5016;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #1f3810;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-content">
            <div class="success-icon">✅</div>
            <h1 class="success-title">Order Successful!</h1>
            <p class="success-message">
                Thank you for your purchase! Your premium Chinese tea from Koh Phangan is on its way.
                <br><br>
                You will receive a confirmation email shortly with your order details and tracking information.
                <br><br>
                We'll also send you a message via WhatsApp/LINE/Telegram with updates.
            </p>
            <a href="index.html" class="back-btn">Back to Shop</a>
        </div>
    </div>
</body>
</html>
